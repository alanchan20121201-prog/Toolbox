<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Date Calculator</title>
<style>
:root{--accent:#e11d48;--bg:#f5f6f8;--surface:#fff;--border:#e3e5ea;--text:#1f2329;--dim:#6b7280;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:"Segoe UI","Microsoft JhengHei","PingFang SC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 16px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:560px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row label{font-size:13px;color:var(--dim)}
.row input{padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)}
.row input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row input[type=number]{width:90px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.out{margin-top:8px;font-size:14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-height:20px;word-break:break-all}
.out b{font-size:17px}
.status{font-size:12px;color:var(--red);min-height:16px;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="subtitle"></p>
<div class="panel">
  <h2 data-i18n="ageTitle"></h2>
  <div class="row">
    <label data-i18n="birth"></label><input type="date" id="birth" />
    <button class="btn primary" id="btn-age" data-i18n="calc"></button>
  </div>
  <div class="out" id="out-age"></div>
</div>
<div class="panel">
  <h2 data-i18n="diffTitle"></h2>
  <div class="row">
    <input type="date" id="d1" />
    <span style="color:var(--dim)">→</span>
    <input type="date" id="d2" />
    <button class="btn primary" id="btn-diff" data-i18n="calc"></button>
  </div>
  <div class="out" id="out-diff"></div>
</div>
<div class="panel">
  <h2 data-i18n="addTitle"></h2>
  <div class="row">
    <input type="date" id="base" />
    <input type="number" id="delta" value="30" />
    <select id="unit"><option value="d" data-i18n="days"></option><option value="w" data-i18n="weeks"></option><option value="m" data-i18n="months"></option><option value="y" data-i18n="years"></option></select>
    <button class="btn primary" id="btn-add" data-i18n="calc"></button>
  </div>
  <div class="out" id="out-add"></div>
</div>
<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
