<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Text Statistics</title>
<style>
:root{--accent:#14b8a6;--bg:#f5f6f8;--surface:#fff;--border:#e3e5ea;--text:#1f2329;--dim:#6b7280}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:"Segoe UI","Microsoft JhengHei","PingFang SC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 16px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:620px}
textarea{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;resize:vertical;line-height:1.6}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--dim)}
.stat b{display:block;font-size:19px;color:var(--text);margin-top:2px}
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="subtitle"></p>
<div class="panel">
  <textarea id="inp" data-i18n-ph="ph"></textarea>
  <div class="grid">
    <div class="stat"><span data-i18n="chars"></span><b id="s-chars">0</b></div>
    <div class="stat"><span data-i18n="charsNs"></span><b id="s-ns">0</b></div>
    <div class="stat"><span data-i18n="words"></span><b id="s-words">0</b></div>
    <div class="stat"><span data-i18n="cjk"></span><b id="s-cjk">0</b></div>
    <div class="stat"><span data-i18n="lines"></span><b id="s-lines">0</b></div>
    <div class="stat"><span data-i18n="read"></span><b id="s-read">0</b></div>
  </div>
</div>
<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
