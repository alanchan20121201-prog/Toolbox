<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pomodoro Timer</title>
<style>
:root{--accent:#ef4444;--accent2:#10b981;--bg:#f5f6f8;--surface:#fff;--border:#e3e5ea;--text:#1f2329;--dim:#6b7280}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:"Segoe UI","Microsoft JhengHei","PingFang SC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 16px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:420px;text-align:center}
.mode{font-size:13px;font-weight:700;color:var(--dim);margin-bottom:8px}
.clock{font-family:Consolas,monospace;font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 14px}
.clock.work{color:var(--accent)} .clock.rest{color:var(--accent2)}
.row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.btn{padding:10px 18px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rest{background:var(--accent2);border-color:var(--accent2);color:#fff}
.opts{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--dim)}
.opts input{width:56px;padding:5px;border:1px solid var(--border);border-radius:7px;text-align:center;font-size:13px}
.count{margin-top:10px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="subtitle"></p>
<div class="panel">
  <div class="mode" id="mode"></div>
  <div class="clock work" id="clock">25:00</div>
  <div class="row">
    <button class="btn primary" id="btn-start" data-i18n="start"></button>
    <button class="btn" id="btn-reset" data-i18n="reset"></button>
    <button class="btn rest" id="btn-rest" data-i18n="rest"></button>
  </div>
  <div class="opts">
    <label><span data-i18n="workLen"></span> <input type="number" id="work" value="25" min="1" max="120" /> <span data-i18n="min"></span></label>
    <label><span data-i18n="restLen"></span> <input type="number" id="rest" value="5" min="1" max="60" /> <span data-i18n="min"></span></label>
  </div>
  <div class="count" id="count"></div>
</div>
<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
