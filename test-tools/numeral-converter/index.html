<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radix Converter</title>
<style>
:root{--accent:#0f766e;--bg:#f5f6f8;--surface:#fff;--border:#e3e5ea;--text:#1f2329;--dim:#6b7280;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:"Segoe UI","Microsoft JhengHei","PingFang SC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 16px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:560px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{width:110px;font-size:13px;font-weight:700;color:var(--dim)}
.row input{flex:1;padding:10px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:Consolas,monospace;background:var(--surface);color:var(--text);min-width:0}
.row input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.bits{margin-top:16px;font-family:Consolas,monospace;font-size:13px;line-height:2;word-break:break-all;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.bits b{color:var(--accent)}
.status{font-size:12px;color:var(--red);min-height:18px;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="subtitle"></p>
<div class="panel">
  <div class="row"><label>BIN (2)</label><input id="b2" data-r="2" spellcheck="false" /></div>
  <div class="row"><label>OCT (8)</label><input id="b8" data-r="8" spellcheck="false" /></div>
  <div class="row"><label>DEC (10)</label><input id="b10" data-r="10" spellcheck="false" /></div>
  <div class="row"><label>HEX (16)</label><input id="b16" data-r="16" spellcheck="false" /></div>
  <div class="status" id="status"></div>
  <div class="bits" id="bits" hidden></div>
</div>
<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
