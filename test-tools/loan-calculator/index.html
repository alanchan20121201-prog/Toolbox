<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Loan Calculator</title>
<style>
:root{--accent:#059669;--bg:#f5f6f8;--surface:#fff;--border:#e3e5ea;--text:#1f2329;--dim:#6b7280;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:"Segoe UI","Microsoft JhengHei","PingFang SC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 16px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:600px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row label{font-size:13px;color:var(--dim);flex:1}
.row input{width:150px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface);color:var(--text)}
.row input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.results{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.results div{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--dim)}
.results b{display:block;font-size:17px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600}
.status{font-size:12px;color:var(--red);min-height:16px;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="subtitle"></p>
<div class="panel">
  <div class="row"><label data-i18n="principal"></label><input type="number" id="p" value="300000" min="0" /></div>
  <div class="row"><label data-i18n="rate"></label><input type="number" id="r" value="3.5" step="0.01" min="0" /> <span style="color:var(--dim);font-size:13px">%</span></div>
  <div class="row"><label data-i18n="years"></label><input type="number" id="y" value="30" min="1" /></div>
  <button class="btn primary" id="btn-calc" data-i18n="calc"></button>
  <div class="status" id="status"></div>
  <div class="results" id="results" hidden>
    <div><span data-i18n="monthly"></span><b id="o-monthly"></b></div>
    <div><span data-i18n="totalPay"></span><b id="o-total"></b></div>
    <div><span data-i18n="totalInt"></span><b id="o-int"></b></div>
  </div>
  <table id="table" hidden>
    <thead><tr><th data-i18n="year"></th><th data-i18n="principal"></th><th data-i18n="interest"></th><th data-i18n="remain"></th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script src="lang.js"></script>
<script src="script.js"></script>
</body>
</html>
